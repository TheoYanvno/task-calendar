<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><h1>Task Calendar</h1> <span id="themeBadge" class="theme-badge" hidden></span></div>
    <div class="top-actions">
      <div class="now" aria-label="Current time and weather">
        <div class="clock"><span id="clockTime"></span><span id="clockDate"></span></div>
        <div class="wx-wrap">
          <button id="weatherBtn" class="weather" aria-expanded="false" aria-controls="wxPanel" title="Weather">
            <span id="wxIcon" aria-hidden="true">🌡️</span> <span id="wxText">Add weather</span>
          </button>
          <div id="wxPanel" class="wx-panel" hidden>
            <p class="wx-place" id="wxPlace"></p>
            <button id="wxLocate" type="button">📍 Use my location</button>
            <form id="wxForm" class="wx-form">
              <input id="wxCity" placeholder="or type a city, e.g. Austin, TX" autocomplete="off" aria-label="City">
              <button class="primary">Set</button>
            </form>
            <div class="wx-row">
              <label><input type="radio" name="wxUnit" value="fahrenheit" checked> °F</label>
              <label><input type="radio" name="wxUnit" value="celsius"> °C</label>
              <a href="https://open-meteo.com/" target="_blank" rel="noopener" class="wx-credit">Weather by Open-Meteo</a>
            </div>
            <p id="wxMsg" class="wx-msg" role="status"></p>
          </div>
        </div>
      </div>
      <button id="seasonal" aria-label="Monthly holiday theme" aria-pressed="true">🎨</button>
      <button id="theme" aria-label="Toggle dark mode">🌙</button>
      <button id="export">Export .ics</button>
    </div>
  </header>

  <main class="layout">
    <section class="calendar" aria-label="Calendar">
      <div class="cal-head">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" aria-label="Next month">›</button>
        <button id="today" class="ghost">Today</button>
      </div>
      <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div id="grid" class="grid"></div>
      <p class="hint">Tip: drag a task onto another day to reschedule it. Shaded days are federal holidays.</p>
    </section>

    <aside class="side">
      <section class="panel">
        <h2 id="dayLabel"></h2>
        <p id="dayHoliday" class="day-holiday" hidden></p>
        <form id="addForm" class="add">
          <input id="title" placeholder="Add a task…" required autocomplete="off" aria-label="Task title">
          <input id="location" placeholder="📍 Location (optional)" autocomplete="off" maxlength="200" aria-label="Location (optional)">
          <div class="row">
            <input id="time" type="time" aria-label="Time (optional)">
            <select id="priority" aria-label="Priority">
              <option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option>
            </select>
            <select id="repeat" aria-label="Repeat">
              <option value="none">Once</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option>
              <option value="weekly">Weekly</option><option value="monthly">Monthly</option>
            </select>
            <button class="primary">Add</button>
          </div>
        </form>
        <ul id="dayTasks" class="tasks"></ul>
      </section>

      <section class="panel">
        <div class="views" role="tablist">
          <button data-view="upcoming" aria-selected="true">Next 7 days</button>
          <button data-view="overdue" aria-selected="false">Overdue <span id="overdueCount" class="badge"></span></button>
        </div>
        <div id="viewList"></div>
      </section>
    </aside>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
